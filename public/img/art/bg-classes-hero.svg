<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 440" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="cbase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c0f15"/>
      <stop offset="100%" stop-color="#05070b"/>
    </linearGradient>
    <linearGradient id="rod" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#39424f" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7c879a" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#2a313c" stop-opacity="0"/>
    </linearGradient>
    <filter id="cb" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="30"/></filter>
  </defs>
  <rect width="1600" height="440" fill="url(#cbase)"/>
  <g filter="url(#cb)" opacity=".85" transform="rotate(-24 800 220)">
    <rect x="120" y="-120" width="150" height="760" rx="75" fill="url(#rod)"/>
    <rect x="360" y="-160" width="120" height="800" rx="60" fill="url(#rod)" opacity=".7"/>
    <rect x="900" y="-140" width="180" height="780" rx="90" fill="url(#rod)" opacity=".8"/>
    <rect x="1240" y="-120" width="120" height="760" rx="60" fill="url(#rod)" opacity=".6"/>
  </g>
</svg>
